name: CI/CD

# Push lên main: build + deploy. Pull request vào main: chỉ build để kiểm tra.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Không cho hai lần deploy chạy chồng lên nhau; lần build kiểm tra cũ của cùng nhánh thì huỷ.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Phiên bản pnpm lấy từ trường packageManager trong package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build

      # Đóng gói .next/standalone/ (server.js + node_modules cần thiết + public, .next/static do
      # `pnpm build` chép vào) thành tar: giữ file ẩn, symlink của pnpm và quyền file; job deploy
      # dùng đúng bản đã kiểm tra, server không phải cài gì thêm.
      - name: Pack build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: tar -czf site.tar.gz -C .next/standalone .

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: site
          path: site.tar.gz
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      # Thư mục đã tạo sẵn trên server, cạnh các project Docker khác ở /home/ubuntu.
      REMOTE_DIR: /home/ubuntu/biztown-web
      # Tên container trong docker-compose.yml trên server.
      CONTAINER: biztown-web
    # CI chỉ ghi thư mục build/ (container chạy node /srv/app/build/server.js) và restart
    # container. docker-compose.yml và .env trên server được tạo và sửa tay — CI không chép,
    # không chạy docker compose.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_KEY_PEM }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host server"
            echo "  HostName ${{ secrets.LIGHTSAIL_HOST }}"
            echo "  User ${{ secrets.LIGHTSAIL_USER }}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
          } > ~/.ssh/config

      - name: Upload build
        run: |
          set -euo pipefail
          # Giải nén vào build.new trước; build/ đang chạy chưa bị đụng tới cho tới bước sau.
          ssh server "rm -rf '$REMOTE_DIR/build.new' && mkdir -p '$REMOTE_DIR/build.new'"
          ssh server "tar -xzf - -C '$REMOTE_DIR/build.new'" < site.tar.gz

      - name: Replace build and restart
        run: |
          ssh server "REMOTE_DIR='$REMOTE_DIR' CONTAINER='$CONTAINER' bash -s" <<'EOF'
          set -euo pipefail
          cd "$REMOTE_DIR"

          # Container chạy bằng user node (uid 1000), không chắc trùng chủ thư mục:
          # thư mục và file phải cho "others" đọc.
          chmod a+rx .
          chmod -R a+rX build.new

          # Thay build/ bằng hai lần đổi tên — gần như tức thì, không có lúc nào build/ chứa
          # nửa cũ nửa mới.
          rm -rf build.old
          if [ -d build ]; then mv build build.old; fi
          mv build.new build

          # Node đã nạp code cũ vào bộ nhớ: restart để chạy bản mới (gián đoạn vài giây).
          # Lần deploy đầu container chưa có: tạo bằng `docker compose up -d` trên server.
          if docker inspect "$CONTAINER" >/dev/null 2>&1; then
            docker restart "$CONTAINER"
            echo "Đã restart $CONTAINER"
          else
            echo "::warning::Chưa có container $CONTAINER — chạy 'docker compose up -d' trong $REMOTE_DIR"
          fi
          rm -rf build.old
          echo "Đã cập nhật $REMOTE_DIR/build"
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
