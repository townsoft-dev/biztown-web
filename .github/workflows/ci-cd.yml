name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Không cho hai lần deploy chạy chồng lên nhau; lần build kiểm tra cũ của cùng nhánh thì huỷ.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Phiên bản pnpm lấy từ trường packageManager trong package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build

      # Đóng gói out/ thành tar: giữ file ẩn và quyền file; job deploy dùng đúng bản đã kiểm tra.
      - name: Pack build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: tar -czf site.tar.gz -C out .

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: site
          path: site.tar.gz
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      # Thư mục đã tạo sẵn trên server, cạnh các project Docker khác ở /home/ubuntu.
      REMOTE_DIR: /home/ubuntu/biztown-web
      # Cổng container nginx mở trên server (docker-compose.yml do người quản lý server giữ).
      HEALTH_BASE: http://127.0.0.1:8090
    # CI chỉ ghi thư mục build/ (nginx phục vụ /srv/site/build). docker-compose.yml và
    # nginx/default.conf trên server được tạo và sửa tay — CI không chép, không chạy docker compose.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_KEY_PEM }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host server"
            echo "  HostName ${{ secrets.LIGHTSAIL_HOST }}"
            echo "  User ${{ secrets.LIGHTSAIL_USER }}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
          } > ~/.ssh/config

      - name: Upload build
        run: |
          set -euo pipefail
          # Giải nén vào build.new trước; build/ đang chạy chưa bị đụng tới cho tới bước sau.
          ssh server "rm -rf '$REMOTE_DIR/build.new' && mkdir -p '$REMOTE_DIR/build.new'"
          ssh server "tar -xzf - -C '$REMOTE_DIR/build.new'" < site.tar.gz

      - name: Replace build
        run: |
          ssh server "REMOTE_DIR='$REMOTE_DIR' HEALTH_BASE='$HEALTH_BASE' bash -s" <<'EOF'
          set -euo pipefail
          cd "$REMOTE_DIR"

          # nginx trong container chạy bằng user nginx (uid 101), không phải ubuntu:
          # thư mục và file phải cho "others" đọc, nếu không trang trả 403.
          chmod a+rx .
          chmod -R a+rX build.new

          # Thay build/ bằng hai lần đổi tên — gần như tức thì, không có lúc nào build/ chứa
          # nửa cũ nửa mới. Bản cũ giữ ở build.old cho tới khi kiểm tra xong.
          rm -rf build.old
          [ -d build ] && mv build build.old
          mv build.new build

          # Kiểm tra bốn URL đã khai với App Store / Google Play (và bản tiếng Anh).
          failed=0
          for path in / /support/ /privacy/ /delete-account/ /en/ /en/support/ /en/privacy/ /en/delete-account/; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_BASE$path")"
            echo "$code $path"
            [ "$code" = "200" ] || failed=1
          done

          if [ "$failed" = 1 ]; then
            echo "::error::Health check thất bại (nginx có đang chạy ở $HEALTH_BASE và phục vụ build/?) — trả lại bản trước"
            if [ -d build.old ]; then
              rm -rf build
              mv build.old build
            fi
            exit 1
          fi

          rm -rf build.old
          echo "Đã cập nhật $REMOTE_DIR/build"
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
