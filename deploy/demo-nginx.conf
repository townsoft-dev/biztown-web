# Cấu hình gateway-nginx cho biztown.vn: nhận 80/443 từ Internet, giữ TLS, rồi proxy về
# container biztown-web ở cổng 8090 (xem deploy/docker-compose.yml).
#
# ĐÂY LÀ MẪU THAM KHẢO. File thật nằm trên server và do người quản trị sửa tay — sửa ở đây
# xong phải áp lại bên đó (`nginx -t` rồi `nginx -s reload`) thì mới có tác dụng.

# --- Khối 1: HTTP (cổng 80) ---
server {
    # Nghe HTTP thường ở cổng 80.
    listen 80;
    # Chỉ áp dụng cho hai tên miền này (khớp với header Host của request).
    server_name biztown.vn www.biztown.vn;

    # Đường dẫn certbot dùng để xác minh tên miền khi cấp/gia hạn chứng chỉ Let's Encrypt.
    # Phải trả lời qua HTTP, không được chuyển sang HTTPS (lúc đó có thể chưa có chứng chỉ).
    location /.well-known/acme-challenge/ {
        # certbot (chế độ webroot) ghi file xác minh vào /var/www/certbot/.well-known/acme-challenge/.
        root /var/www/certbot;
    }

    # Mọi đường dẫn còn lại: chuyển hẳn sang HTTPS, và luôn về tên miền chính.
    location / {
        # 301 = chuyển hướng vĩnh viễn, giữ nguyên đường dẫn + query ($request_uri).
        # Ghi thẳng biztown.vn thay vì $host để http://www... chỉ mất một lần chuyển hướng
        # (dùng $host thì phải qua https://www... rồi mới tới đây — hai lần).
        return 301 https://biztown.vn$request_uri;
    }
}

# --- Khối 2: HTTPS cho www (cổng 443) ---
# Phải có khối riêng: nếu để www.biztown.vn chung server block với biztown.vn thì www trả
# thẳng 200 với nội dung y hệt, tức là cả site tồn tại ở hai địa chỉ. Thẻ canonical trỏ về
# bản không có www nên Google thường tự xử lý đúng, nhưng vẫn tốn lượt crawl và là rủi ro
# trùng lặp nội dung không cần thiết. 301 ở đây dứt điểm chuyện đó.
server {
    listen 443 ssl;
    server_name www.biztown.vn;

    # Chứng chỉ phải bao gồm cả www thì bước bắt tay TLS mới thành công trước khi trả 301.
    ssl_certificate /etc/letsencrypt/live/biztown.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biztown.vn/privkey.pem;

    # 301 = vĩnh viễn; giữ nguyên đường dẫn + query ($request_uri).
    return 301 https://biztown.vn$request_uri;
}

# --- Khối 3: HTTPS cho tên miền chính (cổng 443) ---
server {
    # Nghe cổng 443 và bật TLS cho cổng này.
    listen 443 ssl;
    # Chỉ tên miền chính — www đã được khối trên chuyển hướng sang đây.
    server_name biztown.vn;

    # Chứng chỉ kèm chuỗi trung gian (fullchain) do certbot tạo; thiếu chuỗi thì một số
    # trình duyệt/app báo lỗi chứng chỉ.
    ssl_certificate /etc/letsencrypt/live/biztown.vn/fullchain.pem;
    # Khóa bí mật đi cùng chứng chỉ trên.
    ssl_certificate_key /etc/letsencrypt/live/biztown.vn/privkey.pem;

    location / {
        # Chuyển request về nginx trong container biztown-web. gateway-nginx chạy network host
        # nên 127.0.0.1 là chính máy server, nơi container mở cổng 8090.
        # Không có "/" ở cuối URL → đường dẫn gốc được chuyển nguyên vẹn (vd. /support/).
        proxy_pass http://127.0.0.1:8090;

        # Dùng HTTP/1.1 khi nói chuyện với upstream (mặc định của nginx là 1.0).
        proxy_http_version 1.1;

        # Giữ tên miền gốc; không có dòng này upstream nhận Host là "127.0.0.1:8090".
        proxy_set_header Host $host;
        # IP thật của người dùng (nếu không, upstream chỉ thấy IP của gateway).
        proxy_set_header X-Real-IP $remote_addr;
        # Nối IP người dùng vào chuỗi X-Forwarded-For sẵn có (nếu đi qua nhiều proxy).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Báo upstream rằng request gốc đến qua HTTPS (khối này chỉ phục vụ 443 nên ghi cứng).
        proxy_set_header X-Forwarded-Proto https;

        # Thời gian chờ tối đa để mở kết nối tới upstream.
        proxy_connect_timeout 60s;
        # Thời gian chờ tối đa giữa hai lần gửi dữ liệu liên tiếp tới upstream.
        proxy_send_timeout 60s;
        # Thời gian chờ tối đa giữa hai lần nhận dữ liệu liên tiếp từ upstream.
        # (Cả ba đều là giá trị mặc định của nginx; ghi ra cho rõ.)
        proxy_read_timeout 60s;
    }
}
