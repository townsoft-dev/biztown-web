# MẪU THAM KHẢO. File thật nằm ở /home/ubuntu/biztown-web/docker-compose.yml, do người quản
# lý server tạo và sửa tay — CI KHÔNG chép file này lên và không chạy docker compose.
#
# /home/ubuntu/biztown-web/
# ├─ docker-compose.yml       # sửa tay trên server
# ├─ nginx/default.conf       # sửa tay trên server
# └─ build/                   # CI ghi: nội dung out/ của lần deploy mới nhất
#
# CI cần cấu hình trên server: nginx phục vụ thư mục build
# (mount cả /home/ubuntu/biztown-web, root .../build).
#
# Container chỉ mở cổng trên 127.0.0.1: gateway-nginx (network host) nhận 80/443 của
# biztown.vn và proxy về đây — giống frontend Balheh (8080), dev (8088), storage (8081).
services:
  web:
    image: nginx:1.26.3
    container_name: biztown-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      # Mount cả thư mục (không mount riêng build): CI thay build/ bằng cách đổi tên thư mục,
      # mount riêng build/ thì container vẫn giữ thư mục cũ đã bị đổi tên.
      - ./:/srv/site:ro
      # Mount thư mục chứ không mount file: file ghi đè bằng inode mới vẫn hiện trong container.
      - ./nginx:/etc/nginx/conf.d:ro
