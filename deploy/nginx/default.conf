# MẪU THAM KHẢO. File thật nằm ở /home/ubuntu/biztown-web/nginx/default.conf, do người quản
# lý server tạo và sửa tay — CI KHÔNG chép file này lên. Sửa trên server xong thì:
#   docker exec biztown-web nginx -t && docker exec biztown-web nginx -s reload
#
# nginx trong container biztown-web: phục vụ bản xuất tĩnh của Next.js (out/).
# TLS và tên miền do gateway-nginx xử lý; ở đây chỉ nghe HTTP nội bộ.
server {
    listen 80;
    server_name _;

    root /srv/site/build;
    index index.html;

    # Đứng sau gateway: chuyển hướng (vd. /en → /en/) dùng đường dẫn tương đối,
    # không lộ http:// hay cổng nội bộ.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml;

    # trailingSlash: true → mỗi trang là <trang>/index.html. /support và /support/ đều vào được.
    location / {
        try_files $uri $uri/ =404;
        # HTML luôn hỏi lại server để thấy bản deploy mới ngay.
        add_header Cache-Control "no-cache";
    }

    # JS/CSS có hash trong tên file — cache vĩnh viễn.
    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        # always: không có thì add_header bỏ qua phản hồi mã 404.
        add_header Cache-Control "no-cache" always;
    }
}
